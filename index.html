<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Post Generator</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      button {
        padding: 8px 14px;
        margin-right: 8px;
        cursor: pointer;
      }

      .hidden {
        display: none;
      }

      .preview-card {
        margin-top: 24px;
        padding: 16px;
        max-width: 600px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
      }

      .preview-text {
        white-space: pre-line;
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 12px;
      }

      .carousel {
        display: flex;
        gap: 12px;
        overflow-x: auto;
      }

      .carousel img {
        width: 260px;
        height: 260px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #e0e0e0;
        flex-shrink: 0;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h2>LinkedIn Post Generator</h2>
      <button onclick="connectLinkedIn()">Connect LinkedIn</button>
    </div>

    <hr />

    <input
      id="topic"
      placeholder="Enter topic"
      style="width: 300px; padding: 6px"
    />

    <br /><br />

    <strong>Select Post Type:</strong><br />
    <label>
      <input type="radio" name="postType" value="single" checked />
      Single Image Post
    </label>
    <br />
    <label>
      <input type="radio" name="postType" value="carousel" />
      Multiple Images (Carousel)
    </label>

    <br /><br />

    <button id="generateBtn" onclick="generate()">Generate</button>
    <button id="publishBtn" class="hidden" onclick="publish()">
      Publish to LinkedIn
    </button>

    <div id="preview" class="hidden preview-card">
      <h3>Post Preview</h3>
      <div id="previewText" class="preview-text"></div>
      <div id="carouselPreview" class="carousel"></div>
    </div>

    <script>
      let generatedData = null;
      let selectedPostType = "single";

      function connectLinkedIn() {
        window.location.href = "http://localhost:4000/connect/linkedin";
      }

      async function generate() {
        const topic = document.getElementById("topic").value.trim();
        if (!topic) {
          alert("Please enter a topic");
          return;
        }

        selectedPostType = document.querySelector(
          'input[name="postType"]:checked'
        ).value;

        const generateBtn = document.getElementById("generateBtn");
        generateBtn.innerText = "Generating...";
        generateBtn.disabled = true;

        document.getElementById("preview").classList.add("hidden");
        document.getElementById("publishBtn").classList.add("hidden");

        try {
          const res = await fetch("http://localhost:4000/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              topic,
              postType: selectedPostType,
            }),
          });

          const data = await res.json();
          if (!data.success) {
            alert("Error generating content");
            return;
          }

          generatedData = data.generated;

          document.getElementById("preview").classList.remove("hidden");
          document.getElementById("previewText").innerText = generatedData.post;

          const carousel = document.getElementById("carouselPreview");
          carousel.innerHTML = "";

          // 🔥 ONE LOGIC FOR BOTH SINGLE & CAROUSEL
          generatedData.images.forEach((src) => {
            const img = document.createElement("img");
            img.src = src;
            carousel.appendChild(img);
          });

          document.getElementById("publishBtn").classList.remove("hidden");
        } catch (err) {
          alert("Something went wrong");
        } finally {
          generateBtn.innerText = "Generate";
          generateBtn.disabled = false;
        }
      }

      async function publish() {
        if (!generatedData) return;

        const publishBtn = document.getElementById("publishBtn");
        publishBtn.innerText = "Publishing...";
        publishBtn.disabled = true;

        try {
          const res = await fetch("http://localhost:4000/publish", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              postType: selectedPostType,
              generated: generatedData,
            }),
          });

          const data = await res.json();
          if (data.success) {
            alert("Posted successfully on LinkedIn!");
            document.getElementById("preview").classList.add("hidden");
          } else {
            alert("Failed to publish post");
          }
        } finally {
          publishBtn.innerText = "Publish to LinkedIn";
          publishBtn.disabled = false;
        }
      }
    </script>
  </body>
</html>
