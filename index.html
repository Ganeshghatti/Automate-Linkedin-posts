<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Post Generator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .actions {
        margin-top: 16px;
      }
      button {
        padding: 8px 14px;
        margin-right: 8px;
        cursor: pointer;
      }
      pre {
        background: #f4f4f4;
        padding: 12px;
        margin-top: 16px;
        max-height: 400px;
        overflow: auto;
      }
      .hidden {
        display: none;
      }
      .preview-card {
        margin-top: 24px;
        padding: 16px;
        max-width: 600px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #ffffff;
      }

      .preview-text {
        white-space: pre-line;
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 12px;
      }

      .preview-image {
        width: 100%;
        max-height: 350px; /* 🔥 IMAGE SIZE CONTROL */
        object-fit: contain;
        border-radius: 6px;
        border: 1px solid #e0e0e0;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h2>LinkedIn Post Generator</h2>
      <button onclick="connectLinkedIn()">Connect LinkedIn</button>
    </div>

    <hr />

    <input
      id="topic"
      placeholder="Enter topic"
      style="width: 300px; padding: 5px"
    />
    <br /><br />

    <strong>Select Post Type:</strong><br />
    <label>
      <input type="radio" name="postType" value="single" checked />
      Single Image Post
    </label>
    <br />
    <label>
      <input type="radio" name="postType" value="carousel" />
      Multiple Images (Carousel)
    </label>

    <br /><br />

    <div class="actions">
      <button onclick="generate()">Generate</button>
      <button id="publishBtn" class="hidden" onclick="publish()">
        Publish to LinkedIn
      </button>
    </div>

    <div id="preview" class="hidden preview-card">
      <h3>Post Preview</h3>
      <div id="previewText" class="preview-text"></div>
      <img id="previewImage" class="preview-image" />
    </div>

    <pre id="output"></pre>

    <script>
      let generatedData = null;
      let selectedPostType = null;

      // connect linkedin
      async function connectLinkedIn() {
        window.location.href = "http://localhost:4000/connect/linkedin";
      }

      // generate content only
      async function generate() {
        const topic = document.getElementById("topic").value.trim();
        if (!topic) {
          alert("Please enter a topic");
          return;
        }

        document.getElementById("preview").classList.add("hidden");

        selectedPostType = document.querySelector(
          'input[name="postType"]:checked'
        ).value;

        document.getElementById("publishBtn").classList.add("hidden");
        document.getElementById("output").textContent = "Generating...";

        const res = await fetch("http://localhost:4000/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic, postType: selectedPostType }),
        });

        const data = await res.json();
        console.log("Hiiiiii ", data);
        if (!data.success) {
          document.getElementById("output").textContent =
            "Error generating content";
          return;
        }

        generatedData = data.generated;

        document.getElementById("output").textContent = "";

        // ✅ SHOW PREVIEW
        document.getElementById("preview").classList.remove("hidden");

        // ✅ RENDER IMAGE + TEXT
        document.getElementById("previewImage").src = generatedData.image;
        document.getElementById("previewText").innerText = generatedData.post;

        document.getElementById("publishBtn").classList.remove("hidden");
      }

      // publish the post on linkedin
      async function publish() {
        if (!generatedData) return;

        document.getElementById("publishBtn").disabled = true;

        const res = await fetch("http://localhost:4000/publish", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            postType: selectedPostType,
            generated: generatedData,
          }),
        });

        const data = await res.json();

        if (data.success) {
          alert("Posted successfully on LinkedIn!");
          document.getElementById("publishBtn").classList.add("hidden");
        } else {
          alert("Failed to publish post");
        }

        document.getElementById("publishBtn").disabled = false;
      }
    </script>
  </body>
</html>
